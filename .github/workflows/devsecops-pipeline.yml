name: DevSecOps Basic Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-scans:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit
      - name: Análisis SAST con Bandit
        id: bandit
        continue-on-error: true
        run: bandit -r . -ll -f txt
      - name: Análisis SCA con pip-audit
        id: audit
        continue-on-error: true
        run: pip-audit -r requirements.txt --desc
      - name: Comprobar resultados de seguridad
        if: always()
        env:
          BANDIT_RESULT: ${{ steps.bandit.outcome }}
          AUDIT_RESULT: ${{ steps.audit.outcome }}
        run: |
          echo "Bandit: $BANDIT_RESULT"
          echo "pip-audit: $AUDIT_RESULT"
          if [ "$BANDIT_RESULT" != "success" ] || [ "$AUDIT_RESULT" != "success" ]; then
            exit 1
          fi
